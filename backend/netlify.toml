[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@techstark/opencv-js", "tesseract.js", "tesseract.js-core", "@tesseract.js-data/spa", "sharp"]

[dev]
  port = 8888
  targetPort = 3000

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
